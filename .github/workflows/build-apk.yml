name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*-preview.*']
    paths-ignore:
      - '**/*.md'
      - 'design/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android build tools
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Prepare speech recognition dependencies
        shell: pwsh
        run: .\scripts\prepare-sherpa.ps1

      - name: Run unit tests and build debug APK
        shell: pwsh
        run: .\gradlew.bat --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cueflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-preview:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-preview-${{ github.ref }}
    steps:
      - name: Download the tested APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cueflow-debug-apk
          path: dist

      - name: Publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Expected a preview tag such as v1.0.0-preview.1."
            exit 1
          fi

          apk="dist/cueflow-$TAG-debug.apk"
          mv dist/app-debug.apk "$apk"
          gh release create "$TAG" "$apk" \
            --verify-tag --prerelease --title "CueFlow $TAG" \
            --notes "Debug APK for testing on Android 10 (API 29) and later. Built by [GitHub Actions]($BUILD_URL)."
